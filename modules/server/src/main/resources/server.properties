# Chess Server Configuration
# All values have safe defaults — this file is optional.

# TCP port the server listens on
port=54321

# Maximum number of concurrent active games
max_games=40

# Seconds to wait after a player disconnects before forfeiting the game
disconnect_timeout_seconds=300

# Path to the SQLite database file (relative to the working directory)
db_path=chess.db

# Days before an auth token is considered expired
session_expiry_days=30

# Seconds before an unused join code (waiting for a second player to join) is
# considered expired and cleaned up by the background sweep thread (default: 600 = 10 minutes)
join_code_expiry_seconds=600
